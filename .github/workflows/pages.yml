# Builds the catalog (fresh versions and checksums) and publishes public/ to GitHub Pages.
# Runs on every push to main, once a day so versions stay current, and by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # SITE_URL is where install.sh fetches the catalog from: the Pages address, or a custom domain set as the
      # repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables).
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
      # The fresh catalog has to pass the tests before it goes live; if it doesn't, the last good site stays up.
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
